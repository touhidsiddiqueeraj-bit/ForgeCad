<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#lg)"/>
  <!-- Anvil + hammer hybrid mark: a stylized "F" formed by a hammer head + anvil -->
  <!-- Hammer head (top horizontal bar) -->
  <rect x="16" y="14" width="32" height="8" rx="2" fill="#fff"/>
  <!-- Vertical shaft -->
  <rect x="28" y="14" width="8" height="36" rx="2" fill="#fff"/>
  <!-- Anvil base (bottom horizontal bar, wider) -->
  <rect x="12" y="46" width="40" height="6" rx="2" fill="#fff"/>
  <!-- Spark/highlight -->
  <circle cx="48" cy="18" r="3" fill="#fbbf24"/>
</svg>
